name: Poll live air quality

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Check out BDV
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install polling dependencies
        run: python -m pip install --disable-pip-version-check pandas requests

      - name: Poll Open-Meteo
        run: python scripts/poll_air_quality.py

      - name: Persist new readings
        shell: bash
        run: |
          git config user.name "BDV Air Quality Bot"
          git config user.email "bdv-air-quality-bot@users.noreply.github.com"
          git add data/air_quality_history.csv
          if git diff --cached --quiet; then
            echo "No new observation timestamp to commit."
          else
            git commit -m "Update live air quality history"
            git push
          fi
